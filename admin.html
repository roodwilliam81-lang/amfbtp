<style>
:root{--p:#263a6b;--a:#f0a02c;--bg:#eef1f6;--card:#fff;--bd:#d9dee8;--tx:#1b2136;--mu:#5d6580}
*{box-sizing:border-box}
body{margin:0;font-family:"Barlow",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;margin:0}
header{background:var(--p);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:1.4rem}
.layout{display:flex;gap:20px;padding:20px;align-items:flex-start;flex-wrap:wrap}
aside{flex:0 0 210px;background:var(--card);border:1px solid var(--bd);position:sticky;top:76px}
aside button{display:block;width:100%;text-align:left;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--bd);font:inherit;font-weight:600;cursor:pointer}
aside button.on{background:var(--p);color:#fff}
main{flex:1 1 420px;min-width:300px}
.card{background:var(--card);border:1px solid var(--bd);padding:18px;margin-bottom:16px}
label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:12px 0 4px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--bd);font:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1 1 200px}
button.b{background:var(--p);color:#fff;border:0;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;text-transform:uppercase;font-size:.8rem;letter-spacing:.04em}
button.b.alt{background:var(--a);color:#1b2136}
button.b.gh{background:#fff;color:var(--p);border:1px solid var(--p)}
button.b.dg{background:#c0392b}
button.b:hover{opacity:.9}
.thumb{width:100%;height:130px;object-fit:cover;border:1px solid var(--bd);background:#fafbfc;margin-top:8px}
.item{border:1px dashed var(--bd);padding:12px;margin-top:12px;background:#fbfcfe}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.color{display:flex;align-items:center;gap:8px}
.color input[type=color]{width:46px;height:38px;padding:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2136;color:#fff;padding:12px 20px;z-index:50;display:none;font-weight:600}
small.h{display:block;color:var(--mu);font-size:.78rem;margin-top:4px}
#login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--bd);padding:26px}
</style>

    method:'POST',

    body:file

    .then(cb)

    return merge(JSON.parse(JSON.stringify(DEFAULTS)),stored);

function get(path){ return path.split('.').reduce(function(o,k){return o?o[k]:undefined;},D); }
function set(path,v){ var ks=path.split('.'),o=D; for(var i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v; }
function fld(label,path,type,hint){
  var v=get(path)==null?'':get(path);
  var id='f'+Math.random().toString(36).slice(2);
  var input = type==='area'
    ? '<textarea id="'+id+'">'+String(v).replace(/</g,'&lt;')+'</textarea>'

      : '<input id="'+id+'" value="'+String(v).replace(/"/g,'&quot;')+'">';
  setTimeout(function(){
    var el=document.getElementById(id);
    el.oninput=function(){ set(path,el.value); var c=document.getElementById(id+'c'); if(c) c.value=el.value; };
    var c=document.getElementById(id+'c'); if(c) c.oninput=function(){ el.value=c.value; set(path,c.value); };
  },0);
  return '<label>'+label+'</label>'+input+(hint?'<small class="h">'+hint+'</small>':'');
}

  },0);

function toDataUrl(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1400,w=img.width,h=img.height;
      if(w>max||h>max){ var s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.78));
    };
    img.onerror=function(){ cb(r.result); };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

var MEDIA={prefix:'',rows:null,msg:''};
function mediaUrl(name){ return SB_URL+'/storage/v1/object/public/media/'+MEDIA.prefix+encodeURIComponent(name); }
function mediaLoad(){
  MEDIA.rows=null;
  fetch(SB_URL+'/storage/v1/object/list/media',{method:'POST',headers:Object.assign({},SB_HEADERS,{'Content-Type':'application/json'}),
    body:JSON.stringify({prefix:MEDIA.prefix,limit:300,offset:0,sortBy:{column:'name',order:'asc'}})})
   .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
   .then(function(rows){ MEDIA.rows=rows||[]; if(cur==='medias') render(); })
   .catch(function(){ MEDIA.rows=[]; MEDIA.msg='Impossible de contacter la base de médias.'; if(cur==='medias') render(); });
}
function mediaOpen(name){ MEDIA.prefix=MEDIA.prefix+name+'/'; MEDIA.msg=''; mediaLoad(); render(); }
function mediaUp(){ var p=MEDIA.prefix.replace(/[^/]+\/$/,''); MEDIA.prefix=p; MEDIA.msg=''; mediaLoad(); render(); }
function mediaNewFolder(){
  var n=prompt('Nom du nouveau dossier (ex. chantiers-2026)'); if(!n) return;
  n=n.trim().toLowerCase().replace(/[^a-z0-9-_]/g,'-'); if(!n) return;
  MEDIA.prefix=MEDIA.prefix+n+'/'; MEDIA.msg='Dossier « '+n+' » ouvert : téléversez un fichier pour le créer définitivement.'; mediaLoad(); render();
}
function mediaUpload(inp){
  var files=[].slice.call(inp.files||[]); if(!files.length) return;
  var done=0, fail=0;
  MEDIA.msg='Envoi de '+files.length+' fichier(s)…'; render();
  function next(){
    if(!files.length){ MEDIA.msg='Envoi terminé : '+done+' fichier(s) ajouté(s)'+(fail?' — '+fail+' échec(s)':''); mediaLoad(); render(); return; }
    var f=files.shift();
    var safe=f.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-');
    var path=MEDIA.prefix+Date.now()+'-'+safe;
    fetch(SB_URL+'/storage/v1/object/media/'+path,{method:'POST',headers:Object.assign({},SB_HEADERS,{'Content-Type':f.type||'application/octet-stream','x-upsert':'true'}),body:f})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); done++; })
      .catch(function(){ fail++; })
      .then(next);
  }
  next();
}
function mediaDelete(name){
  if(!confirm('Supprimer définitivement « '+name+' » de la base ?')) return;
  fetch(SB_URL+'/storage/v1/object/media/'+MEDIA.prefix+name,{method:'DELETE',headers:SB_HEADERS})
   .then(function(){ toast('Fichier supprimé'); mediaLoad(); })
   .catch(function(){ toast('Suppression impossible'); });
}
function mediaCopy(name){
  var u=mediaUrl(name);
  if(navigator.clipboard) navigator.clipboard.writeText(u);
  MEDIA.msg='Lien copié : '+u; render();
}
function tMedias(){
  if(MEDIA.rows===null){ setTimeout(mediaLoad,0); return '<p>Chargement de la base de médias…</p>'; }
  var folders=MEDIA.rows.filter(function(r){ return !r.id; });
  var files=MEDIA.rows.filter(function(r){ return r.id; });
  var h='<p style="color:var(--mu);font-size:.9rem">Toutes les images et vidéos du site sont stockées dans la base en ligne. Téléversez ici puis copiez le lien pour l\'utiliser dans une page, ou utilisez directement les champs « Image » / « Vidéo » des autres onglets.</p>'
   +'<p style="font-weight:700">Dossier courant : /'+ (MEDIA.prefix||'') +'</p>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">'
   +(MEDIA.prefix?'<button class="b gh" onclick="mediaUp()">↑ Dossier parent</button>':'')
   +'<button class="b gh" onclick="mediaNewFolder()">+ Nouveau dossier</button>'
   +'<button class="b gh" onclick="mediaLoad()">Rafraîchir</button>'
   +'<button class="b alt" onclick="document.getElementById(\'mup\').click()">Téléverser des fichiers</button>'
   +'<input id="mup" type="file" multiple accept="image/*,video/mp4,video/*" style="display:none" onchange="mediaUpload(this)"></div>'
   +(MEDIA.msg?'<p style="font-size:.85rem;color:var(--p)">'+MEDIA.msg+'</p>':'');
  if(folders.length){
    h+='<h3 style="margin-top:16px">Dossiers</h3><div class="grid2" style="margin-top:10px">'
     +folders.map(function(f){ return '<div class="item"><b>📁 '+f.name+'</b><div style="margin-top:8px"><button class="b gh" onclick="mediaOpen(\''+f.name+'\')">Ouvrir</button></div></div>'; }).join('')+'</div>';
  }
  h+='<h3 style="margin-top:20px">Fichiers ('+files.length+')</h3>';
  if(!files.length) h+='<p style="color:var(--mu)">Aucun fichier dans ce dossier.</p>';
  else h+='<div class="grid2" style="margin-top:10px">'+files.map(function(f){
    var u=mediaUrl(f.name), isVid=/\.(mp4|mov|webm|m4v)$/i.test(f.name);
    return '<div class="item">'+(isVid?'<video class="thumb" src="'+u+'" controls preload="metadata"></video>':'<img class="thumb" src="'+u+'" alt="">')
     +'<p style="font-size:.78rem;word-break:break-all;margin:6px 0 0">'+f.name+'</p>'
     +'<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="b gh" onclick="mediaCopy(\''+f.name.replace(/'/g,"\\'")+'\')">Copier le lien</button>'
     +'<button class="b dg" onclick="mediaDelete(\''+f.name.replace(/'/g,"\\'")+'\')">Supprimer</button></div></div>';
  }).join('')+'</div>';
  return h;
}

      +'</div>';
  });
  h+='<button class="b" style="margin-top:12px" onclick="addItem(\'admin.users\',{name:\'Nouvel administrateur\',email:\'\',password:\'motdepasse\'})">+ Ajouter un administrateur</button>';
  h+='<p style="color:var(--mu);font-size:.9rem;margin-top:14px">N\'oubliez pas de cliquer sur <b>Enregistrer</b> : le nouvel administrateur pourra alors se connecter avec l\'e-mail et le mot de passe indiqués (à lui communiquer).</p>';
  return h;
}
function tSecurite(){
  return '<h3>Mon mot de passe</h3><label>Nouveau mot de passe</label><input id="np" type="text" placeholder="Nouveau mot de passe">'
   +'<button class="b" style="margin-top:12px" onclick="chpw()">Modifier mon mot de passe</button>'
   +'<h3 style="margin-top:26px">Code de récupération</h3>'
   +fld('Code demandé en cas de mot de passe oublié','admin.recovery','','Notez-le précieusement : il permet de réinitialiser n\'importe quel mot de passe depuis l\'écran de connexion.')
   +'<h3 style="margin-top:26px">Vitesse du site</h3>'
   +'<p style="color:var(--mu);font-size:.9rem">Vos photos et vidéos les plus anciennes sont encore intégrées directement dans le fichier du site (au lieu d\'être hébergées sur Supabase), ce qui le rend lourd et lent à charger, surtout en connexion faible. Le bouton ci-dessous les envoie dans votre stockage Supabase et vous prépare des fichiers <b>index.html</b> et <b>admin.html</b> beaucoup plus légers à remettre en ligne chez votre hébergeur, à la place des fichiers actuels.</p>'
   +'<button class="b" style="margin-top:10px" onclick="optimizeSite()">🚀 Optimiser le site (déplacer les images vers le cloud)</button>'
   +'<p id="optProg" style="color:var(--mu);font-size:.85rem;margin-top:8px"></p>'
   +'<h3 style="margin-top:26px">Données</h3>'
   +'<p style="color:var(--mu);font-size:.9rem">Vos contenus sont désormais enregistrés dans votre base Supabase dès que vous cliquez « Enregistrer » : le site public se met à jour automatiquement, sans export manuel. Une copie reste aussi dans ce navigateur au cas où vous seriez hors-ligne. Faites tout de même une sauvegarde .json de temps en temps par sécurité.</p>'
   +'<button class="b dg" style="margin-top:12px" onclick="resetAll()">Réinitialiser tout le contenu</button>';
}
function chpw(){ var v=document.getElementById('np').value.trim(); if(v.length<4) return alert('4 caractères minimum.'); var u=findUser(CURRENT&&CURRENT.email)||users()[0]; u.password=v; localStorage.removeItem(PWKEY); save(); toast('Mot de passe modifié OK'); }
function resetAll(){ if(!confirm('Tout réinitialiser au contenu d\'origine ?')) return; localStorage.removeItem(KEY); D=load(); render(); toast('Contenu réinitialisé'); }
function exportJson(){ dl(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),'amfbtp-contenu.json'); }
function importJson(inp){ var f=inp.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ try{ D=merge(JSON.parse(JSON.stringify(DEFAULTS)),JSON.parse(r.result)); save(); render(); toast('Sauvegarde restaurée OK'); }catch(e){ alert('Fichier invalide'); } }; r.readAsText(f); }
function dataUrlToBlob(du){
  var parts=du.split(','), mime=parts[0].match(/:(.*?);/)[1], bin=atob(parts[1]), arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function optimizeSite(){
  if(!confirm('Envoyer toutes les images/vidéos encore intégrées dans le fichier vers votre stockage Supabase, puis préparer des fichiers plus légers à télécharger ?')) return;
  var prog=document.getElementById('optProg');
  var jobs=[];
  (D.photos||[]).forEach(function(p,i){ if(p.src && p.src.indexOf('data:')===0) jobs.push({obj:p,key:'src',label:'Photo '+(i+1)}); });
  (D.videos||[]).forEach(function(v,i){ if(v.url && v.url.indexOf('data:')===0) jobs.push({obj:v,key:'url',label:'Vidéo '+(i+1)}); });
  if(D.company && D.company.logo && D.company.logo.indexOf('data:')===0) jobs.push({obj:D.company,key:'logo',label:'Logo'});
  if(!jobs.length){ prog.textContent='Rien à optimiser : toutes vos images sont déjà sur le cloud.'; return; }
  var done=0;
  function next(){
    if(done>=jobs.length){
      prog.textContent='Terminé : '+jobs.length+' fichier(s) déplacé(s) vers le cloud. Sauvegarde en cours…';
      save();
      exportSite();
      exportAdminSite();
      prog.textContent='Terminé ✅ — Téléchargez les 2 nouveaux fichiers (index.html + admin.html) et remplacez-les chez votre hébergeur.';
      return;
    }
    var job=jobs[done];
    prog.textContent='Optimisation… '+(done+1)+'/'+jobs.length+' ('+job.label+')';
    var blob=dataUrlToBlob(job.obj[job.key]);
    blob.name=(job.key==='url'?'video.mp4':'image.jpg');
    uploadToCloud(blob,function(publicUrl){ job.obj[job.key]=publicUrl; done++; next(); },function(){ prog.textContent='Échec réseau sur « '+job.label+' » — vérifiez votre connexion et réessayez.'; });
  }
  next();
}
function exportSite(){
  fetch('index.html').then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(html){
    var out=html.replace(/(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/, function(m,a,b){ return a+JSON.stringify(D)+b; });
    dl(new Blob([out],{type:'text/html'}),'index.html');
    toast('index.html exporté avec vos contenus OK');
  }).catch(function(){ alert("L'export du site nécessite d'ouvrir admin.html depuis un serveur web (ou depuis votre hébergement), pas en double-clic local. Utilisez la sauvegarde .json en attendant."); });
}
function exportAdminSite(){
  fetch('admin.html').then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(html){
    var out=html.replace(/(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/, function(m,a,b){ return a+JSON.stringify(D)+b; });
    dl(new Blob([out],{type:'text/html'}),'admin.html');
    toast('admin.html exporté avec vos contenus OK');
  }).catch(function(){});
}
function dl(blob,name){ var u=URL.createObjectURL(blob),a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(function(){URL.revokeObjectURL(u);},1500); }
cloudBadge('☁️ Connexion…');
fetchCloud();
</script>

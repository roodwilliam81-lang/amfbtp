var FONTS=['Barlow','Barlow Condensed','Montserrat','Poppins','Roboto','Oswald','Lato','Open Sans','Raleway','Inter','Playfair Display','Merriweather','Bebas Neue','Anton','Nunito','Rubik','Work Sans','Teko'];
function loadFonts(list){
  var uniq=[]; (list||[]).forEach(function(f){ if(f && FONTS.indexOf(f)>=0 && uniq.indexOf(f)<0) uniq.push(f); });
  if(!uniq.length) return;
  var href='https://fonts.googleapis.com/css2?'+uniq.map(function(f){return 'family='+f.replace(/ /g,'+')+':wght@400;600;700';}).join('&')+'&display=swap';
  var l=document.getElementById('dynfonts');
  if(!l){ l=document.createElement('link'); l.id='dynfonts'; l.rel='stylesheet'; document.head.appendChild(l); }
  if(l.getAttribute('href')!==href) l.setAttribute('href',href);
}
function ff(f){ return f?('font-family:"'+f+'",sans-serif;'):''; }

/* ---------- Sections personnalisées ---------- */
function secWrapStyle(s){
  var st='';
  if(s.bg) st+='background:'+s.bg+';';
  if(s.color) st+='color:'+s.color+';';
  if(s.align) st+='text-align:'+s.align+';';
  st+=ff(s.font);
  if(s.textSize) st+='font-size:'+s.textSize+'px;';
  if(s.padding!=null && s.padding!=='') st+='padding:'+s.padding+'px 0;';
  if(s.bgImage) st+='background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url('+JSON.stringify(s.bgImage).replace(/"/g,"'")+');background-size:cover;background-position:center;';
  return st;
}
function secTitle(s){
  if(!s.title) return '';
  var st=ff(s.titleFont||'')+(s.titleSize?'font-size:'+s.titleSize+'px;':'')+(s.titleColor?'color:'+s.titleColor+';':'');
  return '<h2 class="'+(s.align==='center'?'':'rule')+'" style="'+st+'">'+esc(s.title)+'</h2>';
}
function secBtn(s){
  if(!s.btnLabel) return '';
  return '<div style="margin-top:22px"><a class="btn btn-a" href="'+esc(s.btnLink||'#/contact')+'"'+((s.btnLink||'').indexOf('http')===0?' target="_blank" rel="noopener"':'')+'>'+esc(s.btnLabel)+'</a></div>';
}
function renderSection(s){
  var t=s.type||'texte', inner='';
  if(t==='texte'){
    var body='<div>'+secTitle(s)+(s.text?'<p style="margin-top:18px">'+nl2br(s.text)+'</p>':'')+secBtn(s)+'</div>';
    if(s.image){
      var img='<img loading="lazy" decoding="async" '+imgSet(s.image,640,'(max-width:899px) 100vw, 540px')+' alt="'+esc(s.title||'')+'" style="width:100%;object-fit:cover'+(s.imagePosition==='left'?';order:-1':'')+'">';
      inner='<div class="grid two" style="align-items:center">'+body+img+'</div>';
    } else inner=body;
  } else if(t==='cartes'){
    inner=secTitle(s)+(s.text?'<p style="margin-top:14px">'+nl2br(s.text)+'</p>':'')
      +'<div class="cards" style="margin-top:30px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">'+(s.items||[]).map(function(it){
        return '<div>'+(it.image?'<img loading="lazy" decoding="async" '+imgSet(it.image,400,'(max-width:899px) 100vw, 340px')+' alt="'+esc(it.title||'')+'" style="width:100%;height:170px;object-fit:cover;margin-bottom:12px">':'')
          +'<h3'+(s.titleFont?' style="'+ff(s.titleFont)+'"':'')+'>'+esc(it.title)+'</h3><p style="font-size:.94rem">'+nl2br(it.text)+'</p></div>';
      }).join('')+'</div>'+secBtn(s);
  } else if(t==='galerie'){
    inner=secTitle(s)+'<div class="gal" style="margin-top:26px">'+(s.items||[]).map(function(it){
      return '<figure><img loading="lazy" decoding="async" '+imgSet(it.image,400,'(max-width:899px) 50vw, 360px')+' alt="'+esc(it.title||'')+'">'+(it.title?'<figcaption>'+esc(it.title)+'</figcaption>':'')+'</figure>';
    }).join('')+'</div>'+secBtn(s);
  } else if(t==='video'){
    var src=s.videoUrl||'', emb='', yt=src.match(/(?:youtu\.be\/|v=)([\w-]{6,})/);
    emb = yt ? '<iframe src="https://www.youtube.com/embed/'+yt[1]+'" title="'+esc(s.title||'')+'" allowfullscreen loading="lazy"></iframe>'
             : '<video controls preload="metadata" src="'+esc(src)+'"></video>';
    inner=secTitle(s)+'<div class="vids" style="margin-top:24px;grid-template-columns:1fr"><div class="fr">'+emb+'</div></div>'+secBtn(s);
  } else if(t==='bandeau'){
    inner='<div style="text-align:center">'+secTitle(s)+(s.text?'<p style="max-width:680px;margin:16px auto 0">'+nl2br(s.text)+'</p>':'')+secBtn(s)+'</div>';
  } else if(t==='liste'){
    inner=secTitle(s)+'<ul class="clean" style="margin-top:20px">'+(s.items||[]).map(function(it){
      return '<li><span style="color:var(--accent);font-weight:700">•</span><span><b>'+esc(it.title)+'</b>'+(it.text?' — '+nl2br(it.text):'')+'</span></li>';
    }).join('')+'</ul>'+secBtn(s);
  }
  return '<section class="pad" style="'+secWrapStyle(s)+'"><div class="wrap">'+inner+'</div></section>';
}
function pageSections(slug){
  return (D.sections||[]).filter(function(s){ return (s.page||'/')===slug && s.visible!==false; }).map(renderSection).join('');
